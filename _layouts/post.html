---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="meta"><a href="{{ "/" | relative_url }}">&larr; All posts</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
