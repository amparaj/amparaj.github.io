- name: xP-FPL
  tagline: Expected Points for Fantasy Premier League
  description: >-
    A machine learning sandbox that forecasts expected points (xP) for every
    Fantasy Premier League player and optimises squad selection: starting XI,
    captaincy, transfers and chip timing, with Monte Carlo simulation to show
    the range of likely outcomes.
  tags: [Python, PyTorch, LightGBM, PuLP, React, TypeScript]
  site: https://amparaj.github.io/xpfpl/
  repo: https://github.com/amparaj/xpfpl
  featured: true

- name: F1 Stratbox
  tagline: Race Results, Analysis & Forecasts for Formula 1
  description: >-
    A Formula 1 strategy and forecasting site that tracks lap-by-lap race pace,
    pit stops and tyre degradation, and forecasts pole, podium and win chances
    for the next race, with title odds drawn from 10,000 simulated seasons.
  tags: [Python, FastF1, React, Vite, Streamlit, GitHub Actions]
  site: https://amparaj.github.io/f1-stratbox/
  repo: https://github.com/amparaj/f1-stratbox
  featured: true
